user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    types_hash_max_size 4096;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    include       /etc/nginx/conf.d/*.conf;

    # HTTP(80) → HTTPS(443) 리다이렉트
    server {
        listen 80;
        listen [::]:80;
        server_name hondi.site www.hondi.site;

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS(443) 메인 서버
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name hondi.site www.hondi.site;

        ssl_certificate     "/etc/letsencrypt/live/hondi.site/fullchain.pem";
        ssl_certificate_key "/etc/letsencrypt/live/hondi.site/privkey.pem";
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 10m;
        ssl_prefer_server_ciphers on;
        ssl_protocols TLSv1.2 TLSv1.3;

        # React 정적 파일 서빙
        location / {
            root /home/ec2-user/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # OAuth2 인증 프록시 (카카오/네이버/구글 로그인)
        location /oauth2/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # OAuth2 콜백 프록시 (/login/oauth2/code/* 만 Spring Boot로)
        location /login/oauth2/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Spring Boot API 프록시
        location /api/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Scheme $scheme;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # 업로드 파일 프록시
        location /upload/ {
            proxy_pass         http://127.0.0.1:8080;
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # 채팅 WebSocket 프록시
        location /chattingSock {
            proxy_pass             http://127.0.0.1:8080;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host $host;
            proxy_read_timeout     3600s;
        }

        # 알림 WebSocket 프록시
        location /notificationSock {
            proxy_pass             http://127.0.0.1:8080;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade $http_upgrade;
            proxy_set_header       Connection "upgrade";
            proxy_set_header       Host $host;
            proxy_read_timeout     3600s;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {}
    }
}
