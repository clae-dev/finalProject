spring.application.name=finalProject

# port 번호 (배포 시 Nginx가 80/443 사용, Spring Boot는 8080)
server.port=8080


# Spring DevTools (자동 리로드, 서버 재시작) 설정
# 브라우저 자동 새로고침 기능
spring.devtools.livereload.enabled=true
# 코드 변경 시 서버 자동 재시작
spring.devtools.restart.enabled=true


# 로그 레벨 지정
logging.level.edu.kh.project=debug


# URL에 jsessionid 가 보여질때 설정
server.servlet.session.tracking-modes=cookie

# 개별 파일당 최대 10MB
spring.servlet.multipart.max-file-size=10MB
# 전체 요청당 최대 20MB (썸네일 + 본문 이미지 등 합계)
spring.servlet.multipart.max-request-size=20MB


# MyBatis 설정 (경로 지정만)
mybatis.config-location=classpath:mybatis-config.xml
mybatis.mapper-locations=classpath:mappers/**.xml


# HikariCP 커넥션 풀 설정 (Oracle 유휴 연결 끊김 방지)
# 커넥션 최대 유지 시간 30분 (Oracle 기본 idle timeout보다 짧게)
spring.datasource.hikari.max-lifetime=1800000
# 60초마다 keepalive 쿼리로 연결 유지
spring.datasource.hikari.keepalive-time=60000